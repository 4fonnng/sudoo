<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Indie Sudoku - 獨立樂團風數短遊戲</title>
    <style>
        :root {
            --bg-color: #F4F1EA;
            --card-bg: #EAE3D2;
            --text-color: #2B2B2B;
            --accent-color: #D95D39;
            --border-color: #2B2B2B;
            --error-color: #C0392B;
            --success-color: #4A5D4E;
            --muted-color: #706E6B;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .game-container {
            background-color: var(--card-bg);
            border: 3px solid var(--border-color);
            padding: 25px;
            box-shadow: 6px 6px 0px var(--border-color);
            max-width: 450px;
            width: 100%;
            box-sizing: border-box;
            text-align: center;
        }

        h1 {
            font-size: 1.8rem;
            margin-top: 0;
            margin-bottom: 15px;
            letter-spacing: 2px;
            border-bottom: 2px dashed var(--border-color);
            padding-bottom: 10px;
        }

        .controls, .action-bar {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }

        button {
            background-color: var(--bg-color);
            border: 2px solid var(--border-color);
            color: var(--text-color);
            padding: 6px 12px;
            font-family: 'Courier New', Courier, monospace;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 2px 2px 0px var(--border-color);
            transition: transform 0.1s, box-shadow 0.1s;
        }

        button:hover {
            background-color: var(--accent-color);
            color: #FFF;
        }

        button:active {
            transform: translate(2px, 2px);
            box-shadow: none;
        }

        button.active-mode {
            background-color: var(--accent-color);
            color: #FFF;
        }

        .stats {
            display: flex;
            justify-content: space-between;
            font-size: 0.95rem;
            margin-bottom: 15px;
            font-weight: bold;
            border-top: 2px dashed var(--border-color);
            padding-top: 10px;
        }

        /* 數獨 9x9 網格排版 */
        .sudoku-grid {
            display: grid;
            grid-template-columns: repeat(9, 1fr);
            grid-template-rows: repeat(9, 1fr);
            border: 3px solid var(--border-color);
            background-color: var(--border-color);
            gap: 1px;
            margin-bottom: 15px;
        }

        .cell {
            background-color: var(--bg-color);
            aspect-ratio: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            user-select: none;
            position: relative;
        }

        /* 九宮格粗線條切分 */
        .cell:nth-child(3n) {
            border-right: 2px solid var(--border-color);
        }
        .cell:nth-child(9n) {
            border-right: none;
        }
        .sudoku-grid > div:nth-n(27) { /* 視覺微調可依需求調整 */ }

        .cell.selected {
            background-color: #D6CDB8;
        }

        .cell.fixed {
            color: var(--text-color);
            background-color: #E2DBD0;
        }

        .cell.user-input {
            color: var(--accent-color);
        }

        .cell.error {
            color: var(--error-color);
            background-color: #F8D7DA;
        }

        /* 筆記模式格內 3x3 小數字樣式 */
        .notes-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr);
            width: 100%;
            height: 100%;
            font-size: 0.45rem;
            color: var(--muted-color);
            line-height: 1;
        }

        .notes-grid span {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .number-pad {
            display: grid;
            grid-template-columns: repeat(9, 1fr);
            gap: 5px;
            margin-bottom: 15px;
        }

        .number-pad button {
            padding: 10px 0;
            font-size: 1.1rem;
        }
    </style>
</head>
<body>

    <div class="game-container">
        <h1>// INDIE SUDOKU //</h1>
        
        <!-- 難度與重開局 -->
        <div class="controls">
            <button onclick="setDifficulty('easy')">簡單</button>
            <button onclick="setDifficulty('medium')" class="active-mode">中等</button>
            <button onclick="setDifficulty('hard')">困難</button>
            <button onclick="initGame()">重新開局</button>
        </div>

        <!-- 狀態列 -->
        <div class="stats">
            <span>難度: <span id="current-difficulty">中等</span></span>
            <span>時間: <span id="timer">00:00</span></span>
            <span>失誤: <span id="errors">0</span> 次</span>
        </div>

        <!-- 遊戲主盤面 -->
        <div id="board" class="sudoku-grid"></div>

        <!-- 數字輸入盤 -->
        <div class="number-pad">
            <button onclick="inputNumber(1)">1</button>
            <button onclick="inputNumber(2)">2</button>
            <button onclick="inputNumber(3)">3</button>
            <button onclick="inputNumber(4)">4</button>
            <button onclick="inputNumber(5)">5</button>
            <button onclick="inputNumber(6)">6</button>
            <button onclick="inputNumber(7)">7</button>
            <button onclick="inputNumber(8)">8</button>
            <button onclick="inputNumber(9)">9</button>
        </div>

        <!-- 功能操作列 -->
        <div class="action-bar">
            <button id="btn-note" onclick="toggleNoteMode()">筆記模式: 關</button>
            <button onclick="clearCell()">清除</button>
            <button onclick="checkSolution()">檢查解答</button>
            <button onclick="revealSolution()">看答案</button>
        </div>
    </div>

    <script>
        let board = Array(9).fill(0).map(() => Array(9).fill(0));
        let solution = Array(9).fill(0).map(() => Array(9).fill(0));
        let notes = Array(9).fill(0).map(() => Array(9).fill(() => Set())); // 候選數
        let selectedCell = null;
        let isNoteMode = false;
        let difficulty = 'medium';
        let timerInterval = null;
        let secondsElapsed = 0;
        let errorCount = 0;

        // 簡易預設題庫與挖空邏輯（實務上可透過標準數獨產生器替換）
        const sampleSolutions = [
            [
                [5,3,4,6,7,8,9,1,2],
                [6,7,2,1,9,5,3,4,8],
                [1,9,8,3,4,2,5,6,7],
                [8,5,9,7,6,1,4,2,3],
                [4,2,6,8,5,3,7,9,1],
                [7,1,3,9,2,4,8,5,6],
                [9,6,1,5,3,7,2,8,4],
                [2,8,7,4,1,9,6,3,5],
                [3,4,5,2,8,6,1,7,9]
            ]
        ];

        function initGame() {
            // 載入預設解答並依難度挖空
            solution = sampleSolutions[0];
            let removeCount = difficulty === 'easy' ? 30 : difficulty === 'medium' ? 45 : 55;
            
            board = solution.map(row => [...row]);
            
            // 隨機挖空
            let removed = 0;
            while(removed < removeCount) {
                let r = Math.floor(Math.random() * 9);
                let c = Math.floor(Math.random() * 9);
                if (board[r][c] !== 0) {
                    board[r][c] = 0;
                    removed++;
                }
            }

            // 重置狀態
            errorCount = 0;
            document.getElementById('errors').innerText = errorCount;
            secondsElapsed = 0;
            startTimer();
            renderBoard();
        }

        function renderBoard() {
            const boardEl = document.getElementById('board');
            boardEl.innerHTML = '';

            for (let r = 0; r < 9; r++) {
                for (let c = 0; c < 9; c++) {
                    const cell = document.createElement('div');
                    cell.className = 'cell';
                    cell.dataset.row = r;
                    cell.dataset.col = c;

                    if (board[r][c] !== 0) {
                        cell.innerText = board[r][c];
                        // 判斷是否為初始題目
                        if (solution[r][c] === board[r][c]) {
                            cell.classList.add('fixed');
                        } else {
                            cell.classList.add('user-input');
                            // 即時錯誤檢查
                            if (board[r][c] !== solution[r][c]) {
                                cell.classList.add('error');
                            }
                        }
                    }

                    if (selectedCell && selectedCell.r === r && selectedCell.c === c) {
                        cell.classList.add('selected');
                    }

                    cell.addEventListener('click', () => selectCell(r, c));
                    boardEl.appendChild(cell);
                }
            }
        }

        function selectCell(r, c) {
            selectedCell = { r, c };
            renderBoard();
        }

        function inputNumber(num) {
            if (!selectedCell) return;
            let { r, c } = selectedCell;
            
            // 若為固定初始格子則不能修改
            if (solution[r][c] === board[r][c] && board[r][c] !== 0 && board[r][c] === solution[r][c]) {
                return;
            }

            if (isNoteMode) {
                // 筆記模式邏輯（簡化版點擊切換）
                // 這裡可以擴充候選數顯示
            } else {
                board[r][c] = num;
                if (num !== solution[r][c]) {
                    errorCount++;
                    document.getElementById('errors').innerText = errorCount;
                }
            }
            renderBoard();
        }

        function clearCell() {
            if (!selectedCell) return;
            let { r, c } = selectedCell;
            if (solution[r][c] !== board[r][c] || board[r][c] === 0) {
                board[r][c] = 0;
                renderBoard();
            }
        }

        function toggleNoteMode() {
            isNoteMode = !isNoteMode;
            const btn = document.getElementById('btn-note');
            btn.innerText = `筆記模式: ${isNoteMode ? '開' : '關'}`;
            btn.classList.toggle('active-mode', isNoteMode);
        }

        function setDifficulty(diff) {
            difficulty = diff;
            const names = { easy: '簡單', medium: '中等', hard: '困難' };
            document.getElementById('current-difficulty').innerText = names[diff];
            initGame();
        }

        function startTimer() {
            if (timerInterval) clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                secondsElapsed++;
                let m = String(Math.floor(secondsElapsed / 60)).padStart(2, '0');
                let s = String(secondsElapsed % 60).padStart(2, '0');
                document.getElementById('timer').innerText = `${m}:${s}`;
            }, 1000);
        }

        function checkSolution() {
            let isComplete = true;
            let isCorrect = true;
            for (let r = 0; r < 9; r++) {
                for (let c = 0; c < 9; c++) {
                    if (board[r][c] === 0) isComplete = false;
                    if (board[r][c] !== 0 && board[r][c] !== solution[r][c]) isCorrect = false;
                }
            }
            if (isComplete && isCorrect) {
                alert('恭喜你！成功解開數獨！');
                clearInterval(timerInterval);
            } else if (!isCorrect) {
                alert('目前盤面有錯誤的數字，再檢查看看！');
            } else {
                alert('盤面尚未填滿，加油！');
            }
        }

        function revealSolution() {
            if (confirm('確定要直接看解答嗎？')) {
                board = solution.map(row => [...row]);
                renderBoard();
                clearInterval(timerInterval);
            }
        }

        // 初始化啟動
        initGame();
    </script>
</body>
</html>
