<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我們的靈魂樂 - Indie Sudoku</title>
    <style>
        :root {
            /* 主色調：深墨黑 / 海軍藍 */
            --bg-color: #12161A;         /*整頁背景：極深海軍黑*/
            --card-bg: #1B2228;          /*容器卡片背景：深墨藍灰*/
            --text-color: #F4F1EA;       /*主要文字：仿舊米白*/
            --border-color: #F4F1EA;     /*邊框線條：米白高對比*/
            --accent-color: #E63946;     /*點綴亮紅：龐克搖滾元素*/
            --secondary-color: #A8DADC;  /*次要點綴：復古淡藍*/
            --error-color: #FF6B6B;      /*錯誤紅警示*/
            --fixed-bg: #2C353D;         /*固定題目的格子底色*/
            --selected-bg: #E9C46A;      /*選取格子的復古黃色*/
            --selected-text: #12161A;    /*選取格子的字體顏色*/
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Courier New', Courier, monospace, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .game-container {
            background-color: var(--card-bg);
            border: 4px solid var(--border-color);
            padding: 25px;
            box-shadow: 8px 8px 0px #000000;
            max-width: 450px;
            width: 100%;
            box-sizing: border-box;
            text-align: center;
        }

        h1 {
            font-size: 1.6rem;
            margin-top: 0;
            margin-bottom: 5px;
            letter-spacing: 2px;
            font-weight: 900;
            color: var(--text-color);
        }

        .subtitle {
            font-size: 0.85rem;
            color: var(--secondary-color);
            margin-bottom: 15px;
            font-weight: bold;
            letter-spacing: 1px;
            border-bottom: 2px dashed var(--border-color);
            padding-bottom: 10px;
        }

        .controls, .action-bar {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }

        button {
            background-color: var(--card-bg);
            border: 2px solid var(--border-color);
            color: var(--text-color);
            padding: 6px 12px;
            font-family: 'Courier New', Courier, monospace;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 3px 3px 0px var(--border-color);
            transition: transform 0.05s, box-shadow 0.05s;
        }

        button:hover {
            background-color: var(--secondary-color);
            color: var(--bg-color);
        }

        button:active {
            transform: translate(2px, 2px);
            box-shadow: 1px 1px 0px var(--border-color);
        }

        button.active-mode {
            background-color: var(--accent-color);
            color: #FFF;
            border-color: var(--accent-color);
        }

        .stats {
            display: flex;
            justify-content: space-between;
            font-size: 0.9rem;
            margin-bottom: 15px;
            font-weight: bold;
            border-top: 2px dashed var(--border-color);
            border-bottom: 2px dashed var(--border-color);
            padding: 8px 0;
        }

        /* 數獨 9x9 網格排版 */
        .sudoku-grid {
            display: grid;
            grid-template-columns: repeat(9, 1fr);
            grid-template-rows: repeat(9, 1fr);
            border: 3px solid var(--border-color);
            background-color: var(--border-color);
            gap: 1px;
            margin-bottom: 15px;
        }

        .cell {
            background-color: var(--card-bg);
            aspect-ratio: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.25rem;
            font-weight: bold;
            cursor: pointer;
            user-select: none;
            position: relative;
            color: var(--text-color);
        }

        /* 3x3 九宮格粗線條分隔視覺強化 */
        .cell:nth-child(3n) {
            border-right: 2px solid var(--border-color);
        }
        .cell:nth-child(9n) {
            border-right: none;
        }

        .cell.selected {
            background-color: var(--selected-bg);
            color: var(--selected-text);
        }

        .cell.fixed {
            background-color: var(--fixed-bg);
            color: var(--text-color);
        }

        .cell.user-input {
            color: var(--secondary-color);
        }

        .cell.error {
            color: var(--error-color);
            background-color: #3D1C1C;
        }

        .number-pad {
            display: grid;
            grid-template-columns: repeat(9, 1fr);
            gap: 4px;
            margin-bottom: 15px;
        }

        .number-pad button {
            padding: 8px 0;
            font-size: 1rem;
            box-shadow: 2px 2px 0px var(--border-color);
        }
    </style>
</head>
<body>

    <div class="game-container">
        <h1>OUR SOUL MUSIC</h1>
        <div class="subtitle">// 我們的靈魂樂：數獨挑戰 //</div>
        
        <!-- 難度與重開局 -->
        <div class="controls">
            <button onclick="setDifficulty('easy')">簡單</button>
            <button onclick="setDifficulty('medium')" class="active-mode">中等</button>
            <button onclick="setDifficulty('hard')">困難</button>
            <button onclick="initGame()">重新開局</button>
        </div>

        <!-- 狀態列 -->
        <div class="stats">
            <span>難度: <span id="current-difficulty">中等</span></span>
            <span>時間: <span id="timer">00:00</span></span>
            <span>失誤: <span id="errors">0</span> 次</span>
        </div>

        <!-- 遊戲主盤面 -->
        <div id="board" class="sudoku-grid"></div>

        <!-- 數字輸入盤 -->
        <div class="number-pad">
            <button onclick="inputNumber(1)">1</button>
            <button onclick="inputNumber(2)">2</button>
            <button onclick="inputNumber(3)">3</button>
            <button onclick="inputNumber(4)">4</button>
            <button onclick="inputNumber(5)">5</button>
            <button onclick="inputNumber(6)">6</button>
            <button onclick="inputNumber(7)">7</button>
            <button onclick="inputNumber(8)">8</button>
            <button onclick="inputNumber(9)">9</button>
        </div>

        <!-- 功能操作列 -->
        <div class="action-bar">
            <button id="btn-note" onclick="toggleNoteMode()">筆記: 關</button>
            <button onclick="clearCell()">清除</button>
            <button onclick="checkSolution()">檢查</button>
            <button onclick="revealSolution()">看答案</button>
        </div>
    </div>

    <script>
        let board = Array(9).fill(0).map(() => Array(9).fill(0));
        let solution = Array(9).fill(0).map(() => Array(9).fill(0));
        let selectedCell = null;
        let isNoteMode = false;
        let difficulty = 'medium';
        let timerInterval = null;
        let secondsElapsed = 0;
        let errorCount = 0;

        const sampleSolutions = [
            [
                [5,3,4,6,7,8,9,1,2],
                [6,7,2,1,9,5,3,4,8],
                [1,9,8,3,4,2,5,6,7],
                [8,5,9,7,6,1,4,2,3],
                [4,2,6,8,5,3,7,9,1],
                [7,1,3,9,2,4,8,5,6],
                [9,6,1,5,3,7,2,8,4],
                [2,8,7,4,1,9,6,3,5],
                [3,4,5,2,8,6,1,7,9]
            ]
        ];

        function initGame() {
            solution = sampleSolutions[0];
            let removeCount = difficulty === 'easy' ? 30 : difficulty === 'medium' ? 45 : 55;
            board = solution.map(row => [...row]);
            
            let removed = 0;
            while(removed < removeCount) {
                let r = Math.floor(Math.random() * 9);
                let c = Math.floor(Math.random() * 9);
                if (board[r][c] !== 0) {
                    board[r][c] = 0;
                    removed++;
                }
            }

            errorCount = 0;
            document.getElementById('errors').innerText = errorCount;
            secondsElapsed = 0;
            startTimer();
            renderBoard();
        }

        function renderBoard() {
            const boardEl = document.getElementById('board');
            boardEl.innerHTML = '';

            for (let r = 0; r < 9; r++) {
                for (let c = 0; c < 9; c++) {
                    const cell = document.createElement('div');
                    cell.className = 'cell';
                    cell.dataset.row = r;
                    cell.dataset.col = c;

                    if (board[r][c] !== 0) {
                        cell.innerText = board[r][c];
                        if (solution[r][c] === board[r][c]) {
                            cell.classList.add('fixed');
                        } else {
                            cell.classList.add('user-input');
                            if (board[r][c] !== solution[r][c]) {
                                cell.classList.add('error');
                            }
                        }
                    }

                    if (selectedCell && selectedCell.r === r && selectedCell.c === c) {
                        cell.classList.add('selected');
                    }

                    cell.addEventListener('click', () => selectCell(r, c));
                    boardEl.appendChild(cell);
                }
            }
        }

        function selectCell(r, c) {
            selectedCell = { r, c };
            renderBoard();
        }

        function inputNumber(num) {
            if (!selectedCell) return;
            let { r, c } = selectedCell;
            
            if (solution[r][c] === board[r][c] && board[r][c] !== 0) return;

            if (!isNoteMode) {
                board[r][c] = num;
                if (num !== solution[r][c]) {
                    errorCount++;
                    document.getElementById('errors').innerText = errorCount;
                }
            }
            renderBoard();
        }

        function clearCell() {
            if (!selectedCell) return;
            let { r, c } = selectedCell;
            if (solution[r][c] !== board[r][c] || board[r][c] === 0) {
                board[r][c] = 0;
                renderBoard();
            }
        }

        function toggleNoteMode() {
            isNoteMode = !isNoteMode;
            const btn = document.getElementById('btn-note');
            btn.innerText = `筆記: ${isNoteMode ? '開' : '關'}`;
            btn.classList.toggle('active-mode', isNoteMode);
        }

        function setDifficulty(diff) {
            difficulty = diff;
            const names = { easy: '簡單', medium: '中等', hard: '困難' };
            document.getElementById('current-difficulty').innerText = names[diff];
            initGame();
        }

        function startTimer() {
            if (timerInterval) clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                secondsElapsed++;
                let m = String(Math.floor(secondsElapsed / 60)).padStart(2, '0');
                let s = String(secondsElapsed % 60).padStart(2, '0');
                document.getElementById('timer').innerText = `${m}:${s}`;
            }, 1000);
        }

        function checkSolution() {
            let isComplete = true;
            let isCorrect = true;
            for (let r = 0; r < 9; r++) {
                for (let c = 0; c < 9; c++) {
                    if (board[r][c] === 0) isComplete = false;
                    if (board[r][c] !== 0 && board[r][c] !== solution[r][c]) isCorrect = false;
                }
            }
            if (isComplete && isCorrect) {
                alert('恭喜你！成功解開數獨！');
                clearInterval(timerInterval);
            } else if (!isCorrect) {
                alert('目前盤面有錯誤的數字，再檢查看看！');
            } else {
                alert('盤面尚未填滿，加油！');
            }
        }

        function revealSolution() {
            if (confirm('確定要直接看答案嗎？')) {
                board = solution.map(row => [...row]);
                renderBoard();
                clearInterval(timerInterval);
            }
        }

        initGame();
    </script>
</body>
</html>
